# Plain ConfigMap, not an Argo CD Application -- the root app's directory
# source applies whatever it finds under apps/ as-is, and the grafana
# sidecar (sidecar.dashboards, enabled by default in kube-prometheus-stack)
# auto-loads any ConfigMap in any namespace carrying the grafana_dashboard
# label, so this just needs to exist, not be registered anywhere else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-app-metrics-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cm-app-metrics.json: |
    {
      "title": "cm-backend / cm-frontend",
      "uid": "cm-app-metrics",
      "timezone": "utc",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "title": "HTTP request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Cluster's own Prometheus, not CloudWatch -- Grafana's AWS-authenticated Prometheus datasource options (generic sigV4Auth and the dedicated AMP plugin) both hardcode SigV4 signing to service \"aps\" instead of the \"monitoring\" CloudWatch's OTLP endpoint actually needs, so neither can query it. Same metric, same otel-collector, just the local classic-Prometheus-format copy instead of the CloudWatch-native one.",
          "targets": [
            {
              "expr": "sum by (job) (rate(http_server_request_duration_seconds_count{job=~\"cm-frontend|cm-backend\", http_route!~\"/healthz|/readyz\"}[2m]))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP request duration (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (job, le) (rate(http_server_request_duration_seconds_bucket{job=~\"cm-frontend|cm-backend\", http_route!~\"/healthz|/readyz\"}[2m])))",
              "legendFormat": "{{job}} p95"
            }
          ]
        },
        {
          "id": 3,
          "title": "Container memory (working set)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "From the cluster's own Prometheus (cAdvisor), not app-level OTel metrics -- neither app is instrumented with Node.js runtime/process metrics, only HTTP/DB, so process.* metrics don't exist at all in CloudWatch. This is the actual container memory instead.",
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"backend|frontend\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Container CPU utilization",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "From the cluster's own Prometheus (cAdvisor) -- same reason as the memory panel.",
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"backend|frontend\", container!=\"\", container!=\"POD\"}[5m]))",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Pod replica count",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas{deployment=~\"cm-backend|cm-frontend\"}",
              "legendFormat": "{{deployment}}"
            }
          ]
        }
      ]
    }
