apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    # root applies every manifest under apps/ in one pass -- without this,
    # it tries to create the ScaledObject in apps/platform/frontend-scaledobject.yaml
    # before this Application (and the CRD it installs) exists at all.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.20.2

  destination:
    server: https://kubernetes.default.svc
    namespace: keda

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # crd-scaledjobs.yaml is 667KB -- client-side apply's
      # last-applied-configuration annotation blows past Kubernetes'
      # 262144-byte cap (same failure mode hit with kube-prometheus-stack's
      # CRDs earlier), so that one CRD silently failed to install while
      # the smaller KEDA CRDs succeeded, and the operator crash-looped on
      # "no matches for kind ScaledJob" until this was caught.
      - ServerSideApply=true
