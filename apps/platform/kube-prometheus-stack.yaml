apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.3.0
    helm:
      values: |
        grafana:
          service:
            type: ClusterIP

          serviceAccount:
            create: true
            name: kube-prometheus-stack-grafana
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::276699358299:role/commit-lab-dev-grafana

          # The generic "Prometheus" datasource type (previously used here)
          # sent completely unsigned requests to this URL -- verified
          # directly, the response was AWS's literal "Request is missing
          # Authentication Token" error, not a permissions or query problem.
          # It apparently only applies its sigV4Auth signing for URLs
          # matching the *.aps-workspaces.*.amazonaws.com pattern. The
          # dedicated Amazon Managed Service for Prometheus plugin is what
          # AWS's own docs show pointed at the CloudWatch monitoring
          # endpoint, and it actually signs the request.
          plugins:
            - grafana-amazonprometheus-datasource

          additionalDataSources:
            - name: CloudWatch (OTLP metrics)
              uid: cloudwatch-otlp
              type: grafana-amazonprometheus-datasource
              access: proxy
              url: https://monitoring.eu-central-1.amazonaws.com
              jsonData:
                sigV4Auth: true
                sigV4AuthType: default
                sigV4Region: eu-central-1
              editable: false

          # Grafana's own chart key is literally "grafana.ini" (the ini
          # filename), not a nested path -- server.root_url and
          # serve_from_sub_path are both required together, or Grafana's own
          # links/redirects/asset URLs come out without the /grafana prefix
          # and break once the browser is actually behind that path.
          "grafana.ini":
            server:
              root_url: "https://lab-commit-task.commit-lab.internal/grafana/"
              serve_from_sub_path: true

          # Grouped onto the same ALB as the frontend Ingress
          # (envs/dev/frontend/values.yaml) instead of getting its own.
          # Lower group.order than frontend's "20" so this more specific
          # /grafana rule is evaluated before frontend's catch-all "/" --
          # otherwise "/" would match /grafana requests first.
          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/group.name: commit-lab-dev
              alb.ingress.kubernetes.io/group.order: "10"
              alb.ingress.kubernetes.io/scheme: internal
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:276699358299:certificate/a54dc5d3-9d8d-401b-9a41-e6dff8baa5c0
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
              alb.ingress.kubernetes.io/ssl-redirect: '443'
            hosts:
              - lab-commit-task.commit-lab.internal
            path: /grafana
            pathType: Prefix

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs are large enough that client-side apply's
      # last-applied-configuration annotation blows past Kubernetes' 262144-byte
      # annotation cap; server-side apply tracks field ownership instead of
      # stuffing the whole manifest into an annotation, so it doesn't hit the limit.
      - ServerSideApply=true
