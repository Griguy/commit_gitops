apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.170.0
    helm:
      releaseName: otel-collector
      values: |
        # Single gateway instance: apps push OTLP straight to it, so there's
        # no per-node scraping to justify a DaemonSet.
        mode: deployment
        replicaCount: 1

        image:
          repository: otel/opentelemetry-collector-contrib

        serviceAccount:
          create: true
          name: otel-collector
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::276699358299:role/commit-lab-dev-otel-collector

        ports:
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
          # Local re-exposition of ingested metrics for the in-cluster
          # Prometheus to scrape -- separate from CloudWatch export, so KEDA
          # can query request-rate for autoscaling without needing AWS
          # credentials or leaving the cluster.
          prom-exporter:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP

        config:
          receivers:
            jaeger: null
            zipkin: null
            # Container CPU/memory (cAdvisor) and pod replica counts
            # (kube-state-metrics) only exist in the cluster's own Prometheus
            # -- neither app emits them via OTLP, and there's no other path
            # to get them into CloudWatch's OTLP store. Federating the
            # specific series needed reuses the already-working CloudWatch
            # export pipeline instead of standing up a second one (e.g.
            # awscontainerinsightreceiver).
            prometheus:
              config:
                scrape_configs:
                  - job_name: cm-app-container-metrics
                    scrape_interval: 30s
                    honor_labels: true
                    metrics_path: /federate
                    params:
                      "match[]":
                        - '{__name__=~"container_cpu_usage_seconds_total|container_memory_working_set_bytes|kube_deployment_status_replicas", namespace=~"backend|frontend"}'
                    static_configs:
                      - targets:
                          - kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

          exporters:
            # CloudWatch's OTLP endpoint is HTTP-only (no gRPC), and metrics
            # and logs are two separate endpoints/services, so they need
            # their own otlphttp exporter instances and sigv4 identities.
            otlphttp/metrics:
              tls:
                insecure: false
              # `endpoint` is a base URL that the exporter appends /v1/metrics
              # to itself -- using it with the full path already included
              # doubled the path (.../v1/metrics/v1/metrics, a 404) and
              # dropped every export. `metrics_endpoint` is the override
              # that's used as-is, matching `logs_endpoint` below.
              metrics_endpoint: "https://monitoring.eu-central-1.amazonaws.com/v1/metrics"
              auth:
                authenticator: sigv4auth/metrics

            otlphttp/logs:
              compression: gzip
              logs_endpoint: "https://logs.eu-central-1.amazonaws.com/v1/logs"
              # Every log record on this pipeline lands in one log group/stream --
              # fine for a single-cluster setup where service.name on each record
              # is enough to tell frontend and backend apart in Logs Insights. A
              # routing processor keyed on service.name would be the next step if
              # per-service log groups become worth the extra pipeline complexity.
              headers:
                x-aws-log-group: /commit-lab/dev/otel
                x-aws-log-stream: default
              auth:
                authenticator: sigv4auth/logs

            # Re-exposes ingested metrics in classic Prometheus exposition
            # format (histograms as _count/_bucket/_sum families) -- unlike
            # the otlphttp/metrics path to CloudWatch, this is exactly the
            # format KEDA's prometheus scaler and a local Prometheus expect.
            prometheus:
              endpoint: 0.0.0.0:8889

          extensions:
            sigv4auth/metrics:
              service: "monitoring"
              region: "eu-central-1"
            sigv4auth/logs:
              service: "logs"
              region: "eu-central-1"

          service:
            extensions:
              - health_check
              - sigv4auth/metrics
              - sigv4auth/logs
            pipelines:
              metrics:
                receivers:
                  - otlp
                  - prometheus
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlphttp/metrics
                  - prometheus
              logs:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlphttp/logs
              traces: null

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
