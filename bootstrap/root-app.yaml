apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Griguy/commit_gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # k6-load-generator's replica count is meant to be scaled manually
  # (kubectl scale ... --replicas=1/0) to start/stop the load-test demo --
  # without this, selfHeal would revert that back to the manifest's
  # replicas: 0 on its next sync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: k6-load-generator
      namespace: load-testing
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
